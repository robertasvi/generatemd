<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent Instructions Generator</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    try {
      const theme = localStorage.getItem('theme');
      const dark = theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', dark === 'dark');
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
